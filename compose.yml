services:
  caddy:
    image: caddy:2.11-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      - "${BUN_PORT:-5173}:5173"
    volumes:
      - ./src:/app:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
    restart: unless-stopped

  php:
    image: app/php:8.5.2
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    working_dir: /app
    volumes:
      - ./src:/app
    environment:
      COMPOSER_HOME: /tmp/composer
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bun:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./src:/app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: bun run dev
    restart: unless-stopped

  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${DB_NAME:-demo}
      POSTGRES_USER: ${DB_USER:-demo}
      POSTGRES_PASSWORD: ${DB_PASS:-demo}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-demo} -d ${DB_NAME:-demo}"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
